name = "webbot-dominio-propio-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Host wildcard de Railway que sirve los sitios (ver docs/DOMINIO_PROPIO.md).
[vars]
ORIGIN_HOST = "custom.sitios.devalpo.cl"

# WORKER_SHARED_SECRET NO va aquí: es un secreto y se carga con
#   npx wrangler secret put WORKER_SHARED_SECRET
# El mismo valor debe estar en la variable WORKER_SHARED_SECRET del servicio
# web-bot en Railway, si no src/proxy.ts ignora la cabecera X-Forwarded-Host.

# Ruta del Worker como fallback origin de Cloudflare for SaaS en la zona
# devalpo.cl. Se deja comentada para que `wrangler dev` funcione sin la zona
# configurada; descomentar (o agregarla desde el dashboard) al desplegar.
# routes = [
#   { pattern = "*/*", zone_name = "devalpo.cl" }
# ]
